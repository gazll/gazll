<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  script-src 'self' https://accounts.google.com/gsi/client;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://*.googleusercontent.com;
  connect-src 'self' https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com;
  frame-src https://accounts.google.com/gsi/;
  worker-src 'none';
  upgrade-insecure-requests
">
<title>Backend Engineering — Technical Mastery Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skiplink" href="#view-track">Skip to content</a>

<header class="top">
  <div class="top-inner">
    <button class="navtoggle" id="navToggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="brand">
      <div class="seal">&lt;/&gt;</div>
      <div class="brandtext">
        <h1>Backend Engineering · Technical Mastery Track</h1>
        <p><span id="viewCrumb">Study Track</span></p>
      </div>
    </div>
    <div class="headright">
      <div class="progress-wrap track-only">
        <div class="progress-meta">Đã ôn<br><b id="reviewedCount">0</b> / <span id="totalCount">0</span> mục</div>
        <div class="ring" id="ring"></div>
      </div>
      <span class="syncstate" id="syncState"></span>
      <div class="authbar" id="authbar"></div>
      <button class="hdrtoggle" id="hdrToggle" aria-label="Thu gọn header" aria-expanded="true" title="Thu gọn header (phím H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
      </button>
    </div>
  </div>
  <div class="stepper-wrap track-only">
    <div class="groupbar" id="groupbar" role="group" aria-label="Lọc theo nhóm chủ đề"></div>
    <div class="stepper" id="stepper"></div>
  </div>
</header>

<div class="nav-scrim" id="navScrim"></div>
<aside class="navpanel" id="navPanel" aria-label="Main navigation">
  <div class="np-head">
    <div class="np-brand"><span class="seal">&lt;/&gt;</span><b>GAZLL</b></div>
    <button class="np-close" id="navClose" aria-label="Close menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="np-body" id="mainnav"></nav>
  <p class="np-foot">Everything works signed out — progress is saved on this device.</p>
</aside>

<main>
  <!-- VIEW: topic track -->
  <section id="view-track" class="view">
    <div id="panel" class="day-panel"></div>
    <nav class="pager">
      <button class="pbtn prev" id="prevBtn">← Chủ đề trước</button>
      <div>
        <div class="pcenter">Chủ đề <b id="curDay">1</b> / <span id="totDay">19</span></div>
        <div class="pdots" id="dots"></div>
      </div>
      <button class="pbtn next" id="nextBtn">Chủ đề tiếp →</button>
    </nav>
    <p class="foot-note">Tự trả lời từng mục trước khi mở lời giải — đó là cách luyện hiệu quả nhất.</p>
  </section>

  <!-- VIEW: every other menu renders in here -->
  <section id="view-host" class="view" hidden></section>
</main>

<!-- type="module" is required: app.js imports from lib/ and views/ -->
<script type="module" src="app.js"></script>
</body>
</html>
