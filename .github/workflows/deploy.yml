name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Variables, not Secrets: neither value is a secret (the browser needs
      # both and they are readable in the page source). Keeping them out of
      # the repo only stops GitHub scraping; real protection is the ID token
      # check in Code.gs. Unset -> site still deploys, in offline mode.
      - name: Generate config.js
        env:
          CLIENT_ID: ${{ vars.GAZL_GOOGLE_CLIENT_ID }}
          SCRIPT_URL: ${{ vars.GAZL_SCRIPT_URL }}
        run: |
          # Report lengths, not values: enough to tell "unset" from "set" when
          # the site comes up Offline, without needing to read the values.
          echo "GAZL_GOOGLE_CLIENT_ID: ${#CLIENT_ID} chars"
          echo "GAZL_SCRIPT_URL:       ${#SCRIPT_URL} chars"

          if [ -z "$CLIENT_ID" ] || [ -z "$SCRIPT_URL" ]; then
            echo "::warning::Variables not visible to this run - deploying in OFFLINE mode. Check: (1) they are under Variables, not Secrets; (2) they are on THIS repo; (3) the run started after the variables were saved - re-run if not."
          else
            echo "Sync enabled."
          fi

          # jq so a stray quote cannot break the JS literal.
          {
            echo "// Generated by deploy.yml - do not edit."
            echo "export const GOOGLE_CLIENT_ID = $(jq -rn --arg v "$CLIENT_ID" '$v | @json');"
            echo "export const SCRIPT_URL = $(jq -rn --arg v "$SCRIPT_URL" '$v | @json');"
          } > public/config.js

      # No build step, so this is the only guard against a typo shipping.
      # stdin + --input-type=module: states ESM instead of relying on the
      # runner's Node version auto-detecting it.
      - name: Check JavaScript syntax
        run: |
          fail=0
          for f in $(find public -name '*.js' | sort); do
            node --input-type=module --check < "$f" || { echo "FAIL $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
